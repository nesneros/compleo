# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
#
# Tiny companion spec for examples/other_spec's "$spec(...)" demo: $spec delegates
# completion to an entirely separate spec file's own command tree.
name: subspec
description: A separate spec, completed via $spec(...) from examples/other_spec.
flags:
  --color=: {description: a color, default: red}
positionals:
  - name: fruit
    description: a fruit name
