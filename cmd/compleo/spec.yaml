# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: compleo
description: >-
  Parses a zsh script's command line, emits its usage text, and generates
  zsh completion — all from one spec file.
commands:
  - name: activate
    description: Enable Tab-completion for compleo-wrapped scripts in this shell. Add to .zshrc before compinit runs, e.g. eval "$(compleo activate)".
  - name: generate
    description: Generate Tab-completion for a compleo-wrapped script. Run once after writing or editing the script; a new shell (or "compleo activate" in the current one) picks it up.
    positionals:
      - name: script
        description: The script to generate completion for — a bare name resolved via $PATH, or a path.
        required: true
    completion:
      positional:
        - ["$compleo.scripts"]
  - name: parse
    description: Parse the wrapped script's command line against the spec piped on stdin, printing zsh for the script to eval. Most scripts should use "up" instead; reach for this directly when you need control over the name or arguments passed.
    flags:
      --name=: "The script's own name (e.g. \"${0:t}\"), shown in --help/error text and used for completion. Lets the spec's heredoc skip name: and stay quoted, so nothing needs escaping."
    positionals:
      - name: args
        variadic: true
  - name: up
    description: Wire compleo into a script from the spec piped on stdin — the simplest way to integrate compleo, e.g. eval "$(compleo up <<SPEC ... SPEC)". Use "parse" directly if you need finer control over the invocation.
  - name: validate
    description: Validate the spec piped on stdin and exit.
  - name: version
    description: Print compleo's version and exit.
