# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: compleo
description: >-
  Parses a zsh script's command line, emits its usage text, and generates
  zsh completion — all from one spec file.
commands:
  - name: activate
    description: Print zsh code adding compleo's completions directory to fpath. Eval this in .zshrc before compinit, e.g. eval "$(compleo activate)".
  - name: completion
    description: Print compleo's own zsh completion script and exit.
  - name: generate
    description: Generate zsh completion for an executable on PATH that wraps compleo (equivalent to running it with COMPLEO_MODE=generate set).
    positionals:
      - name: name
        description: Executable to generate completion for, resolved via $PATH.
        required: true
    completion:
      positional:
        - ["$compleo.scripts"]
  - name: parse
    description: Parse the wrapped script's command line against the spec piped on stdin.
    flags:
      --dump: Print the result to stderr too, before stdout (for debugging).
    positionals:
      - name: args
        variadic: true
  - name: validate
    description: Validate the spec piped on stdin and exit.
  - name: version
    description: Print compleo's version and exit.
