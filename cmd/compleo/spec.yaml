# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: compleo
description: >-
  Parses a zsh script's command line, emits its usage text, and generates
  zsh completion — all from one spec file.
commands:
  - name: activate
    description: Print zsh code adding compleo's completions directory to fpath. Eval this in .zshrc before compinit, e.g. eval "$(compleo activate)".
  - name: completion
    description: Print compleo's own zsh completion script and exit.
  - name: generate
    description: Generate zsh completion for a script that wraps compleo (equivalent to running it with COMPLEO_MODE=generate set).
    positionals:
      - name: script
        description: The script to generate completion for — a bare name resolved via $PATH, or a path.
        required: true
    completion:
      positional:
        - ["$compleo.scripts"]
  - name: parse
    description: Parse the wrapped script's command line against the spec piped on stdin. You will typically want to use "use" instead.
    flags:
      --name=: The script's own invoking name (e.g. "${0:t}"), for --help/error text and completion — lets a spec's heredoc skip name:, and stay quoted (no $/`-escaping needed).
    positionals:
      - name: args
        variadic: true
  - name: use
    description: Print zsh that re-invokes "compleo parse" with --name and -- "$@" filled in from the spec piped on stdin. Simplest way to wire compleo into a script, e.g. eval "$(compleo use <<SPEC ... SPEC)"; use "parse" directly for finer control.
  - name: validate
    description: Validate the spec piped on stdin and exit.
  - name: version
    description: Print compleo's version and exit.
