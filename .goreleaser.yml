version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/compleo
    binary: compleo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

brews:
  - repository:
      owner: nesneros
      name: homebrew-tap
    directory: Formula
    description: "Compleo CLI"
    homepage: "https://github.com/nesneros/compleo"
        
    test: |
      system "#{bin}/compleo", "version"
