version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/compleo
    binary: compleo
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

homebrew_casks:
  - repository:
      owner: nesneros
      name: homebrew-tap
    description: "Compleo CLI"
    homepage: "https://github.com/nesneros/compleo"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/compleo"]
          end
