[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
goreleaser = "2.18.3"
act = "0.2.89"

[env]
# So "go run ./cmd/compleo activate" during development writes into the project
# instead of the derault ~/.local/share/compleo/completions.
COMPLEO_COMPLETION_DIR = "{{config_root}}/.completions"

# For debug append errors to a file. Errors are swallowed by the completion script (by design)
COMPLEO_DEBUG_LOG = "{{config_root}}/bin/errors.txt"

# So the demo scripts resolve as plain commands (e.g. "greet"), not just "./examples/greet" —
# needed for their generated completions to work at all: the completion file's own xargs
# callback re-invokes the script itself by bare name, which fails silently (stderr is
# suppressed) if it's not on PATH.
_.path = ["{{config_root}}/examples"]

[tasks.build]
description = "Build the compleo binary"
run = "go build -o bin/compleo ./cmd/compleo"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.fmt]
description = "Format source files"
run = "gofmt -l -w ."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run ./..."

[tasks.check]
description = "fmt check, vet, lint, and test"
run = [
  "test -z \"$(gofmt -l .)\"",
  "go vet ./...",
  "golangci-lint run ./...",
  "go test ./...",
]

[tasks.install]
description = "Install the compleo binary"
run = 'go install -ldflags "-X main.commit=$(git rev-parse HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" ./cmd/compleo'

[tasks.release-check]
description = "Validate .goreleaser.yml without building anything"
run = "goreleaser check"

[tasks.release-dry-run]
description = "Build release artifacts locally without publishing"
run = "goreleaser release --snapshot --clean"
